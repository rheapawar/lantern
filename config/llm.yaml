# Which LLM Lantern's single structured call uses. Switching provider/model is a config change here plus
# a provider class in lantern/llm.py. API keys live in .env (never in this file).

version: 0.2
provider: openai               # openai (OPENAI_API_KEY in .env) | gemini (GEMINI_API_KEY)
model: gpt-6.2-sol-healthcare  # undated alias - each card records the exact model_version that answered
reasoning_effort: medium       # openai reasoning models: low | medium | high
temperature: null              # null = the model's default
max_output_tokens: 16000       # includes reasoning tokens
timeout_seconds: 600
prompt: prompts/referral_card.md

# Rate limiting / retries
min_seconds_between_calls: 2   # shared across workers (lantern/pipeline.py)
max_retries: 5                 # on rate limits and 5xx, with backoff; out-of-quota stops the run at once

