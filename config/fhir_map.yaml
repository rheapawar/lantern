# Lantern FHIR lookup map: HOW to find things in a FHIR chart.
# pathways/<specialty>.json holds the clinical rules and refers to these entries by id only.
# This file changes when the data source changes (Synthea currently, Epic later); 
#
# Lookup kinds:
#   loinc          Observation codes
#   procedure_sct  Procedure SNOMED codes
#   conditions     lowercase fragments matched against Condition display text
#   meds           lowercase fragments matched against MedicationRequest names
#   age / sex      from Patient;  smoking: smoking-status Observation
#   referral_text  look in the referral note itself
# All lookups run on the chart AFTER it is cut at the referral date.

version: 0.1
source_system: synthea_fhir_r4

# Tests: a test counts as done if any of these records exists (recency rules come later).
tests:
  ecg: {procedure_sct: ["29303009", "268400002"]}
  ecg_compare_prior: {procedure_sct: ["29303009", "268400002"]}
  lipids: {loinc: ["57698-3", "2093-3", "18262-6"]}
  a1c: {loinc: ["4548-4"]}
  kidney_panel: {loinc: ["33914-3", "2160-0", "38483-4", "3094-0", "6299-2"]}
  electrolytes: {loinc: ["2823-3", "6298-4", "19123-9", "21377-7"]}
  calcium: {loinc: ["17861-6", "49765-1"]}
  glucose: {loinc: ["2345-7", "2339-0"]}
  cbc: {loinc: ["718-7", "6690-2", "777-3"], procedure_sct: ["104091002"]}
  liver_panel: {loinc: ["1742-6", "1920-8", "1975-2"]}
  tsh: {loinc: ["3016-3"]}
  nt_probnp: {loinc: ["33762-6", "71425-3"]}
  iron_studies: {loinc: ["2276-4", "2502-3"]}
  urinalysis: {loinc: ["5794-3", "5799-2", "5792-7"]}
  urine_albumin: {loinc: ["14959-1"]}
  aldosterone_renin: {}   # not recorded in Synthea, so never shows as done
  out_of_office_bp: {}   # not recorded in Synthea, so never shows as done
  echo: {procedure_sct: ["40701008", "433236007"]}
  chest_xray: {procedure_sct: ["399208008"]}
  ambulatory_monitor: {procedure_sct: ["710839006"]}
  stress_or_ccta: {procedure_sct: ["76746007"]}

# Where to find each fact. The pathway uses these ids in decision_facts and in threshold rules (chart_obs).
