  sex: {sex: true}
  smoking: {smoking: true}
  family_history: {referral_text: true}
  hypertension: {conditions: ["hypertension"]}
  diabetes: {conditions: ["diabetes"]}
  hyperlipidemia: {conditions: ["hyperlipidemia", "hypercholesterolemia"]}
  heart_failure: {conditions: ["heart failure"]}
  atrial_fibrillation: {conditions: ["atrial fibrillation"]}
  prior_mi_cad: {conditions: ["myocardial infarction", "ischemic heart disease", "coronary", "bypass"]}
  valve_disease: {conditions: ["valve"]}
